<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">서울과 제주를 잇는 가을비 풍경</title>
  <desc id="desc">서울 한강 전경에서 제주 성산 해안으로 빠르게 이동하고 빗줄기가 겹쳐 내리는 짧은 모션 장면.</desc>
  <defs>
    <clipPath id="frame"><rect width="960" height="540" rx="18"/></clipPath>
    <linearGradient id="mist" x2="0" y2="1"><stop stop-color="#d6e3e8" stop-opacity=".10"/><stop offset="1" stop-color="#102332" stop-opacity=".40"/></linearGradient>
    <filter id="whip"><feGaussianBlur stdDeviation="0 0"><animate attributeName="stdDeviation" values="0 0;18 0;0 0" keyTimes="0;.5;1" dur="8s" repeatCount="indefinite"/></feGaussianBlur></filter>
    <linearGradient id="rain" x2="0" y2="1"><stop stop-color="#eaf6ff" stop-opacity=".04"/><stop offset=".55" stop-color="#eaf6ff" stop-opacity=".72"/><stop offset="1" stop-color="#eaf6ff" stop-opacity=".03"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <g filter="url(#whip)">
      <g>
        <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Han_River_Seoul_skyline_Pixabay_1214950.jpg/1280px-Han_River_Seoul_skyline_Pixabay_1214950.jpg" width="960" height="540" preserveAspectRatio="xMidYMid slice"/>
        <animateTransform attributeName="transform" type="translate" values="20 0; -24 0; -45 -4" keyTimes="0;.6;1" dur="3.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" additive="sum" type="scale" values="1;1.10;1.16" keyTimes="0;.6;1" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.50;1" dur="8s" repeatCount="indefinite"/>
      </g>
      <g>
        <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Seongsan%2C_Jeju_Island.jpg/1280px-Seongsan%2C_Jeju_Island.jpg" width="960" height="540" preserveAspectRatio="xMidYMid slice"/>
        <animateTransform attributeName="transform" type="translate" values="960 0;960 0;0 0; -22 -5" keyTimes="0;.455;.50;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" additive="sum" type="scale" values="1.12;1.12;1.04;1.12" keyTimes="0;.455;.50;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.455;.50;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      </g>
    </g>
    <rect width="960" height="540" fill="url(#mist)"/>
    <g fill="none" stroke="url(#rain)" stroke-width="2.4" stroke-linecap="round">
      <path d="M92 -70v72"><animateTransform attributeName="transform" type="translate" values="0 0;20 680" dur="1.25s" repeatCount="indefinite"/></path>
      <path d="M208 -140v94"><animateTransform attributeName="transform" type="translate" values="0 0;34 690" dur="1.05s" begin="-.3s" repeatCount="indefinite"/></path>
      <path d="M345 -90v65"><animateTransform attributeName="transform" type="translate" values="0 0;15 700" dur="1.4s" begin="-.7s" repeatCount="indefinite"/></path>
      <path d="M476 -155v100"><animateTransform attributeName="transform" type="translate" values="0 0;30 710" dur="1.1s" begin="-.5s" repeatCount="indefinite"/></path>
      <path d="M612 -110v78"><animateTransform attributeName="transform" type="translate" values="0 0;18 690" dur="1.3s" begin="-.9s" repeatCount="indefinite"/></path>
      <path d="M734 -175v112"><animateTransform attributeName="transform" type="translate" values="0 0;28 700" dur="1.0s" begin="-.2s" repeatCount="indefinite"/></path>
      <path d="M860 -95v70"><animateTransform attributeName="transform" type="translate" values="0 0;18 700" dur="1.35s" begin="-.6s" repeatCount="indefinite"/></path>
      <path d="M149 -230v100"><animateTransform attributeName="transform" type="translate" values="0 0;24 700" dur="1.15s" begin="-.8s" repeatCount="indefinite"/></path>
      <path d="M557 -260v130"><animateTransform attributeName="transform" type="translate" values="0 0;26 710" dur="1.05s" begin="-.4s" repeatCount="indefinite"/></path>
    </g>
  </g>
</svg>
